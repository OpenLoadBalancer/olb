version: "2"

run:
  go: "1.26"

linters:
  # The v2 "standard" set (errcheck, govet, ineffassign, staticcheck,
  # unused) plus:
  enable:
    - bodyclose
    - contextcheck
    - gocritic
    - gosec
    - misspell
    - prealloc
    - unconvert
  settings:
    errcheck:
      # An explicit `_ = f()` is a deliberate discard; only flag silently
      # dropped errors.
      check-blank: false
      # Calls whose error carries no actionable signal at the call site:
      # deadline/keepalive setters fail only on an already-closed conn (the
      # next Read/Write reports it), and response/log writes cannot be
      # retried once headers or bytes are out.
      exclude-functions:
        - (net.Conn).SetDeadline
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
        - (*net.TCPConn).SetKeepAlive
        - (*net.TCPConn).SetKeepAlivePeriod
        - (*net.UDPConn).SetReadDeadline
        - (*net.UDPConn).SetDeadline
        - (*net.UDPConn).SetWriteDeadline
        - (net.PacketConn).SetReadDeadline
        - (*encoding/json.Encoder).Encode
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).Flush
        - (*bytes.Buffer).WriteByte
        - (*bytes.Buffer).WriteString
    gosec:
      excludes:
        - G104 # Audit errors not checked
  exclusions:
    generated: lax
    # Equivalent of golangci-lint v1's default exclusions.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may ignore errors from cleanup/setup helpers and use fixed
      # credentials, weak randomness and the like.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
      # Nil-check-then-dereference is a common, intended pattern in tests.
      - path: _test\.go
        linters:
          - staticcheck
        text: SA5011
      # These tests feed deliberately misspelled config keys to the
      # unknown-key detector.
      - path: internal/config/unknown_keys_test\.go
        linters:
          - misspell
    paths:
      # Go sources shipped inside npm packages.
      - internal/webui/node_modules
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
